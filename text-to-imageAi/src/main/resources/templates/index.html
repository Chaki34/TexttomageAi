<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Chat</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{

            background:#0f172a;
            color:white;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .container{

            width:900px;
            max-width:95%;
            height:90vh;

            background:#111827;

            border-radius:15px;

            display:flex;
            flex-direction:column;

            overflow:hidden;

            box-shadow:0 0 30px rgba(0,0,0,.5);

        }

        .header{

            background:#1e293b;

            padding:20px;

            text-align:center;

            font-size:24px;

            font-weight:bold;

        }

        #chatBox{

            flex:1;

            overflow-y:auto;

            padding:20px;

            display:flex;

            flex-direction:column;

            gap:15px;

        }

        .user{

            align-self:flex-end;

            background:#2563eb;

            padding:12px 16px;

            border-radius:12px;

            max-width:75%;

        }

        .bot{

            align-self:flex-start;

            background:#374151;

            padding:12px 16px;

            border-radius:12px;

            max-width:75%;

            white-space:pre-wrap;

        }

        .footer{

            display:flex;

            padding:15px;

            background:#1e293b;

            gap:10px;

        }

        textarea{

            flex:1;

            resize:none;

            border:none;

            outline:none;

            border-radius:10px;

            padding:15px;

            font-size:16px;

            height:60px;

        }

        button{

            width:120px;

            border:none;

            border-radius:10px;

            cursor:pointer;

            background:#2563eb;

            color:white;

            font-size:16px;

            transition:.3s;

        }

        button:hover{

            background:#1d4ed8;

        }

        .loading{

            color:#94a3b8;

            font-style:italic;

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        Spring AI + OpenRouter Chat

    </div>

    <div id="chatBox"></div>

    <div class="footer">

        <textarea
                id="prompt"
                placeholder="Ask anything..."></textarea>

        <button onclick="sendPrompt()">

            Send

        </button>

    </div>

</div>

<script>

    async function sendPrompt(){

        const textarea=document.getElementById("prompt");

        const prompt=textarea.value.trim();

        if(prompt==="") return;

        const chat=document.getElementById("chatBox");

        chat.innerHTML+=
        `<div class="user">${escapeHtml(prompt)}</div>`;

        textarea.value="";

        chat.innerHTML+=
        `<div class="bot loading" id="loading">
            Thinking...
         </div>`;

        chat.scrollTop=chat.scrollHeight;

        const formData=new URLSearchParams();

        formData.append("prompt",prompt);

        try{

            const response=await fetch("/chat",{

                method:"POST",

                headers:{
                    "Content-Type":"application/x-www-form-urlencoded"
                },

                body:formData

            });

            const text=await response.text();

            document.getElementById("loading").remove();

            chat.innerHTML+=
            `<div class="bot">${escapeHtml(text)}</div>`;

        }catch(e){

            document.getElementById("loading").remove();

            chat.innerHTML+=
            `<div class="bot">
                Error connecting to AI.
             </div>`;

        }

        chat.scrollTop=chat.scrollHeight;

    }

    function escapeHtml(text){

        const div=document.createElement("div");

        div.innerText=text;

        return div.innerHTML;

    }

    document.getElementById("prompt")
        .addEventListener("keydown",function(e){

            if(e.key==="Enter" && !e.shiftKey){

                e.preventDefault();

                sendPrompt();

            }

        });

</script>

</body>
</html>
