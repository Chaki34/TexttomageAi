<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --g-blue: #4285F4;
            --g-red: #EA4335;
            --g-yellow: #FBBC05;
            --g-green: #34A853;
            --google-gradient: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020406;
            color: #f8fafc;
            overflow: hidden;
        }

        /* The Google Strap Border Effect */
        .google-strap-card {
            position: relative;
            background: #0f1115;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .google-strap-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--google-gradient);
            z-index: 10;
        }

        .glass-panel {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
            margin: 4px 0;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 1.75rem;
        }

        .sidebar-active {
            background: rgba(66, 133, 244, 0.1);
            color: var(--g-blue);
            font-weight: 600;
        }

        .btn-google {
            background: #ffffff;
            color: #000;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255,255,255,0.3);
        }

        .prompt-container {
            background: #0f1115;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 24px;
        }

        /* Animated Shimmer for Skeletons */
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }

        .user-badge {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body class="h-screen flex">

<!-- Sidebar -->
<aside class="w-72 glass-panel flex flex-col hidden lg:flex">
    <div class="p-8">
        <div class="flex items-center gap-3 text-xl font-bold tracking-tight text-white">
            <div class="w-10 h-10 rounded-xl flex items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0" style="background: var(--google-gradient); opacity: 0.2;"></div>
                <i class="fas fa-microchip text-blue-500"></i>
            </div>
            <span>NEXUS <span class="font-light opacity-60">STUDIO</span></span>
        </div>

        <div class="mt-8 flex items-center gap-3 p-3 user-badge rounded-2xl">
            <img th:src="'https://ui-avatars.com/api/?name=' + ${username} + '&background=4285F4&color=fff&bold=true'"
                 class="w-10 h-10 rounded-full border border-white/10" alt="User">
            <div class="overflow-hidden">
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Workspace</p>
                <p class="text-sm font-bold truncate" th:text="${username}">Username</p>
            </div>
        </div>
    </div>

    <nav class="flex-1 px-6 space-y-1">
        <div class="sidebar-item sidebar-active p-4 cursor-pointer flex items-center gap-4 transition-all">
            <i class="fas fa-wand-magic-sparkles"></i> <span>Create Image</span>
        </div>
        <div class="sidebar-item text-slate-400 p-4 cursor-pointer flex items-center gap-4">
            <i class="fas fa-grip-vertical"></i> <span>Gallery</span>
        </div>
        <div class="sidebar-item text-slate-400 p-4 cursor-pointer flex items-center gap-4">
            <i class="fas fa-bolt"></i> <span>Models</span>
        </div>
        <div class="sidebar-item text-slate-400 p-4 cursor-pointer flex items-center gap-4">
            <i class="fas fa-gear"></i> <span>Settings</span>
        </div>
    </nav>

    <div class="p-8 border-t border-white/5">
        <form th:action="@{/logout}" method="post">
            <button class="flex items-center gap-2 text-slate-500 hover:text-white transition-colors text-sm">
                <i class="fas fa-power-off"></i> Logout
            </button>
        </form>
    </div>
</aside>

<!-- Main Container -->
<main class="flex-1 flex flex-col relative overflow-hidden bg-[#020406]">

    <!-- Header -->
    <header class="h-20 flex items-center justify-between px-10 z-10 border-b border-white/5 bg-black/20">
        <div class="flex items-center gap-6">
            <h2 class="text-lg font-semibold tracking-tight">AI Engine <span class="text-blue-500 text-xs ml-2 px-2 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/20">FLUX.1 v2</span></h2>
        </div>
        <div class="flex items-center gap-5">
            <div class="text-right hidden md:block">
                <p class="text-xs text-slate-500 font-medium">Credits Remaining</p>
                <!-- Use Thymeleaf to show initial count and ID for JS updates -->
                <p class="text-sm font-bold text-green-500">
                    <span id="tokenDisplay" th:text="${tokens}">200</span> PX
                </p>
            </div>
            <div class="h-8 w-px bg-white/10"></div>
            <button class="text-slate-400 hover:text-white transition-colors"><i class="far fa-bell text-xl"></i></button>
        </div>
    </header>

    <!-- Main View -->
    <div class="flex-1 overflow-y-auto px-10 py-10" id="mainView">

        <!-- Welcome Hero -->
        <div id="heroSection" class="max-w-3xl mx-auto text-center mb-16 mt-10">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 text-xs font-medium text-slate-400 mb-6">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                System Online: Processing at 450ms/it
            </div>
            <h1 class="text-6xl font-bold tracking-tighter text-white mb-6">What will you <br/><span class="text-transparent bg-clip-text" style="background-image: var(--google-gradient);">Imagine today?</span></h1>
            <p class="text-slate-400 text-lg leading-relaxed">Turn text into professional-grade visuals using the world's most advanced open-source AI models.</p>
        </div>

        <!-- Grid -->
        <div id="imageGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
            <!-- Results injected here -->
        </div>
    </div>

    <!-- Floating Input Box -->
    <div class="p-10 z-20">
        <div class="max-w-5xl mx-auto prompt-container p-2">
            <div class="flex flex-col md:flex-row items-end gap-2 p-2">
                <div class="flex-1 w-full">
                    <textarea id="promptInput"
                              class="w-full bg-transparent border-none outline-none p-4 text-white placeholder-slate-600 resize-none h-16 text-lg"
                              placeholder="An astronaut riding a horse on mars, cinematic lighting..."></textarea>
                </div>
                <div class="flex items-center gap-2 pb-2 pr-2">
                    <button class="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-white/5 text-slate-400 transition-colors">
                        <i class="fas fa-sliders text-lg"></i>
                    </button>
                    <button onclick="generateImage()" id="genBtn" class="btn-google px-8 py-3 rounded-xl font-bold flex items-center gap-3">
                        Generate
                        <div class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] text-white" style="background: var(--google-gradient)">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                    </button>
                </div>
            </div>
            <!-- Bottom Multi-color Strap -->
            <div class="h-1 w-full rounded-b-2xl mt-1" style="background: var(--google-gradient); opacity: 0.8;"></div>
        </div>
    </div>
</main>

<script>
    async function generateImage() {
        const promptInput = document.getElementById("promptInput");
        const tokenDisplay = document.getElementById("tokenDisplay"); // Reference to the PX counter
        const prompt = promptInput.value.trim();
        const genBtn = document.getElementById("genBtn");
        const imageGrid = document.getElementById("imageGrid");
        const heroSection = document.getElementById("heroSection");

        // 1. Basic Validation
        if (!prompt) return;

        // 2. Client-side Token Check
        let currentTokens = parseInt(tokenDisplay.innerText);
        if (currentTokens <= 0) {
            alert("⚠️ Your daily tokens are exhausted. Please wait 24 hours for your renewal.");
            return;
        }

        // 3. UI Loading State
        genBtn.disabled = true;
        genBtn.style.opacity = "0.5";
        genBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin mr-2"></i> Processing...`;
        if(heroSection) heroSection.classList.add('hidden');

        // 4. Create Google-Strap Skeleton Placeholder
        const skeletonId = 'skele-' + Date.now();
        const skeletonHTML = `
            <div id="${skeletonId}" class="google-strap-card h-96 flex flex-col bg-[#0f1115]">
                <div class="skeleton flex-1"></div>
                <div class="p-6 space-y-3">
                    <div class="skeleton h-3 w-3/4 rounded-full opacity-20"></div>
                    <div class="skeleton h-3 w-1/2 rounded-full opacity-10"></div>
                </div>
            </div>
        `;
        imageGrid.insertAdjacentHTML('afterbegin', skeletonHTML);
        // Scroll to the new generation
        imageGrid.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

        const formData = new URLSearchParams();
        formData.append("prompt", prompt);

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            // 5. Handle Specific Token Errors (402 Payment Required)
            if (response.status === 402) {
                throw new Error("OUT_OF_TOKENS");
            }

            if (!response.ok) throw new Error("GEN_FAILED");

            // 6. Update Real-time Token Count from Response Header
            const remainingTokens = response.headers.get("X-Tokens-Remaining");
            if (remainingTokens !== null) {
                tokenDisplay.innerText = remainingTokens;
                // Visual Pulse Effect on token update
                tokenDisplay.parentElement.classList.add('scale-110', 'text-white');
                setTimeout(() => {
                    tokenDisplay.parentElement.classList.remove('scale-110', 'text-white');
                }, 500);
            }

            // 7. Render Result
            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            const skeleton = document.getElementById(skeletonId);

            skeleton.innerHTML = `
                <div class="relative group h-full overflow-hidden rounded-2xl">
                    <img src="${imageUrl}" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt="AI Generated">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 flex flex-col justify-end p-8">
                        <p class="text-sm text-slate-300 mb-6 line-clamp-3 italic font-medium">"${escapeHtml(prompt)}"</p>
                        <div class="flex gap-3">
                            <a href="${imageUrl}" download="nexus-gen-${Date.now()}.png" class="flex-1 bg-white text-black py-3 rounded-xl text-center text-xs font-bold hover:bg-slate-200 transition-all">
                                <i class="fas fa-download mr-2"></i> Download
                            </a>
                            <button onclick="copyPrompt('${escapeHtml(prompt)}')" class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-xl hover:bg-white/20 transition-all">
                                <i class="far fa-copy text-white"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;

        } catch (error) {
            const skeleton = document.getElementById(skeletonId);
            if (error.message === "OUT_OF_TOKENS") {
                skeleton.innerHTML = `
                    <div class="p-10 flex flex-col items-center justify-center h-full text-yellow-500 text-center">
                        <i class="fas fa-clock text-3xl mb-4"></i>
                        <p class="font-bold">Daily Limit Reached</p>
                        <p class="text-xs text-slate-500 mt-2">Tokens reset every 24 hours.</p>
                    </div>`;
            } else {
                skeleton.innerHTML = `
                    <div class="p-10 flex flex-col items-center justify-center h-full text-red-500 text-center">
                        <i class="fas fa-exclamation-triangle text-3xl mb-4"></i>
                        <p class="font-bold">Generation Failed</p>
                        <p class="text-xs text-slate-500 mt-2">The AI model is overloaded. Please try again.</p>
                    </div>`;
            }
        } finally {
            // 8. Restore Button State
            genBtn.disabled = false;
            genBtn.style.opacity = "1";
            genBtn.innerHTML = `Generate <div class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] text-white" style="background: var(--google-gradient)"><i class="fas fa-paper-plane"></i></div>`;
            promptInput.value = "";
        }
    }

    function copyPrompt(text) {
        navigator.clipboard.writeText(text);
        // Simple success feedback
        const btn = event.currentTarget;
        const originalIcon = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check text-green-400"></i>';
        setTimeout(() => btn.innerHTML = originalIcon, 2000);
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text;
        return div.innerHTML;
    }

    // Handle Enter Key
    document.getElementById("promptInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            generateImage();
        }
    });
</script>
</body>
</html>
