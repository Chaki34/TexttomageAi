<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --g-blue: #4285F4;
            --g-red: #EA4335;
            --g-yellow: #FBBC05;
            --g-green: #34A853;
            --google-gradient: linear-gradient(90deg, #4285F4, #EA4335, #FBBC05, #34A853);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020406;
            color: #f8fafc;
            overflow: hidden;
        }

        /* The Google Strap Border Effect */
        .google-strap-card {
            position: relative;
            background: #0f1115;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .google-strap-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--google-gradient);
            z-index: 10;
        }

        .glass-panel {
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
        }

        .sidebar-item {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
            margin: 4px 0;
        }

        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.05);
            padding-left: 1.75rem;
        }

        .sidebar-active {
            background: rgba(66, 133, 244, 0.1);
            color: var(--g-blue);
            font-weight: 600;
        }

        .btn-google {
            background: #ffffff;
            color: #000;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(255,255,255,0.3);
        }

        .prompt-container {
            background: #0f1115;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 24px;
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }

        .user-badge {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- EXTRA RESPONSIVE OVERRIDES --- */
        @media (max-width: 1024px) {
            #sidebar {
                position: fixed;
                left: -100%;
                top: 0;
                bottom: 0;
                z-index: 100;
                transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            }
            #sidebar.active {
                left: 0;
                width: 85%;
            }
            .main-content { width: 100%; }
        }

        @media (max-width: 768px) {
            header { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }
            #mainView { padding: 1.25rem !important; }
            #heroSection h1 { font-size: 2.5rem !important; }
            .p-10.z-20 { padding: 1rem !important; }
            .token-text { font-size: 0.75rem !important; }
        }
    </style>
</head>
<body class="h-screen flex">

<!-- Sidebar (With ID and Close Button for Mobile) -->
<aside id="sidebar" class="w-72 glass-panel flex flex-col hidden lg:flex">
    <div class="p-8">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 text-xl font-bold tracking-tight text-white">
                <div class="w-10 h-10 rounded-xl flex items-center justify-center relative overflow-hidden">
                    <div class="absolute inset-0" style="background: var(--google-gradient); opacity: 0.2;"></div>
                    <i class="fas fa-microchip text-blue-500"></i>
                </div>
                <span>NEXUS <span class="font-light opacity-60">STUDIO</span></span>
            </div>
            <!-- Close Button (Mobile Only) -->
            <button onclick="toggleMenu()" class="lg:hidden text-white text-2xl">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="mt-8 flex items-center gap-3 p-3 user-badge rounded-2xl">
            <img th:src="'https://ui-avatars.com/api/?name=' + ${username} + '&background=4285F4&color=fff&bold=true'"
                 class="w-10 h-10 rounded-full border border-white/10" alt="User">
            <div class="overflow-hidden">
                <p class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider">Workspace</p>
                <p class="text-sm font-bold truncate" th:text="${username}">Username</p>
            </div>
        </div>
    </div>

    <nav class="flex-1 px-6 space-y-1">
        <div class="sidebar-item sidebar-active p-4 cursor-pointer flex items-center gap-4 transition-all">
            <i class="fas fa-wand-magic-sparkles"></i> <span>Create Image</span>
        </div>
        <div class="sidebar-item text-slate-400 p-4 cursor-pointer flex items-center gap-4">
            <i class="fas fa-grip-vertical"></i> <span>Gallery</span>
        </div>
        <div class="sidebar-item text-slate-400 p-4 cursor-pointer flex items-center gap-4">
            <i class="fas fa-bolt"></i> <span>Models</span>
        </div>
        <div class="sidebar-item text-slate-400 p-4 cursor-pointer flex items-center gap-4">
            <i class="fas fa-gear"></i> <span>Settings</span>
        </div>
    </nav>

    <div class="p-8 border-t border-white/5">
        <form th:action="@{/logout}" method="post">
            <button class="flex items-center gap-2 text-slate-500 hover:text-white transition-colors text-sm">
                <i class="fas fa-power-off"></i> Logout Account
            </button>
        </form>
    </div>
</aside>

<!-- Main Container -->
<main class="flex-1 flex flex-col relative overflow-hidden bg-[#020406] main-content">

    <!-- Header -->
    <header class="h-20 flex items-center justify-between px-10 z-10 border-b border-white/5 bg-black/20">
        <div class="flex items-center gap-4">
            <!-- Hamburger Button -->
            <button onclick="toggleMenu()" class="lg:hidden text-white text-xl p-2 hover:bg-white/5 rounded-lg">
                <i class="fas fa-bars"></i>
            </button>
            <h2 class="text-sm md:text-lg font-semibold tracking-tight">AI Engine <span class="hidden sm:inline-block text-blue-500 text-xs ml-2 px-2 py-0.5 rounded-full bg-blue-500/10 border border-blue-500/20">FLUX.1 v2</span></h2>
        </div>

        <div class="flex items-center gap-3 sm:gap-5">
            <!-- Tokens (Forced visible on all screens) -->
            <div class="text-right">
                <p class="text-[10px] text-slate-500 font-medium uppercase">Credits</p>
                <p class="text-xs sm:text-sm font-bold text-green-500">
                    <span id="tokenDisplay" th:text="${tokens}">200</span> <span class="text-[10px] opacity-50">PX</span>
                </p>
            </div>
            <div class="h-8 w-px bg-white/10"></div>
            <button class="text-slate-400 hover:text-white transition-colors"><i class="far fa-bell text-lg"></i></button>
        </div>
    </header>

    <!-- Main View -->
    <div class="flex-1 overflow-y-auto px-10 py-10" id="mainView">
        <div id="heroSection" class="max-w-3xl mx-auto text-center mb-16 mt-10 px-4">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 border border-white/10 text-[10px] sm:text-xs font-medium text-slate-400 mb-6">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                System Online: Processing at 450ms/it
            </div>
            <h1 class="text-4xl sm:text-6xl font-bold tracking-tighter text-white mb-6 leading-tight">What will you <br/><span class="text-transparent bg-clip-text" style="background-image: var(--google-gradient);">Imagine today?</span></h1>
            <p class="text-slate-400 text-sm sm:text-lg leading-relaxed max-w-xl mx-auto">Turn text into professional-grade visuals using the world's most advanced open-source AI models.</p>
        </div>

        <div id="imageGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8 pb-32">
            <!-- Results injected here -->
        </div>
    </div>

    <!-- Floating Input Box -->
    <div class="p-4 sm:p-10 z-20 absolute bottom-0 left-0 right-0 bg-gradient-to-t from-[#020406] via-[#020406] to-transparent">
        <div class="max-w-5xl mx-auto prompt-container p-2">
            <div class="flex flex-col md:flex-row items-end gap-2 p-1">
                <div class="flex-1 w-full">
                    <textarea id="promptInput"
                              class="w-full bg-transparent border-none outline-none p-3 text-white placeholder-slate-600 resize-none h-14 sm:h-16 text-sm sm:text-lg"
                              placeholder="An astronaut riding a horse on mars..."></textarea>
                </div>
                <div class="flex items-center gap-2 pb-2 pr-2 w-full sm:w-auto justify-end">
                    <button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white/5 text-slate-400">
                        <i class="fas fa-sliders"></i>
                    </button>
                    <button onclick="generateImage()" id="genBtn" class="btn-google px-5 sm:px-8 py-2.5 sm:py-3 rounded-xl font-bold flex items-center gap-3 text-sm">
                        Generate
                        <div class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] text-white" style="background: var(--google-gradient)">
                            <i class="fas fa-paper-plane"></i>
                        </div>
                    </button>
                </div>
            </div>
            <div class="h-1 w-full rounded-b-2xl mt-1" style="background: var(--google-gradient); opacity: 0.8;"></div>
        </div>
    </div>
</main>

<script>
    // Toggle Mobile Menu
    function toggleMenu() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('active');
    }

    async function generateImage() {
        const promptInput = document.getElementById("promptInput");
        const tokenDisplay = document.getElementById("tokenDisplay");
        const prompt = promptInput.value.trim();
        const genBtn = document.getElementById("genBtn");
        const imageGrid = document.getElementById("imageGrid");
        const heroSection = document.getElementById("heroSection");

        if (!prompt) return;

        let currentTokens = parseInt(tokenDisplay.innerText);
        if (currentTokens <= 0) {
            alert("⚠️ Your daily tokens are exhausted.");
            return;
        }

        genBtn.disabled = true;
        genBtn.style.opacity = "0.5";
        genBtn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i>`;
        if(heroSection) heroSection.classList.add('hidden');

        const skeletonId = 'skele-' + Date.now();
        const skeletonHTML = `<div id="${skeletonId}" class="google-strap-card h-80 sm:h-96 flex flex-col bg-[#0f1115]"><div class="skeleton flex-1"></div></div>`;
        imageGrid.insertAdjacentHTML('afterbegin', skeletonHTML);

        const formData = new URLSearchParams();
        formData.append("prompt", prompt);

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            if (response.status === 402) throw new Error("OUT_OF_TOKENS");
            if (!response.ok) throw new Error("GEN_FAILED");

            const remainingTokens = response.headers.get("X-Tokens-Remaining");
            if (remainingTokens !== null) tokenDisplay.innerText = remainingTokens;

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            const skeleton = document.getElementById(skeletonId);

            skeleton.innerHTML = `
                <div class="relative group h-full overflow-hidden rounded-2xl">
                    <img src="${imageUrl}" class="w-full h-full object-cover transition-all group-hover:scale-105">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-all flex flex-col justify-end p-4">
                        <p class="text-xs text-slate-300 italic mb-4">"${prompt}"</p>
                        <a href="${imageUrl}" download class="bg-white text-black py-2 rounded-lg text-center text-[10px] font-bold">Download PNG</a>
                    </div>
                </div>`;
        } catch (error) {
            document.getElementById(skeletonId).remove();
            alert("Error generating image.");
        } finally {
            genBtn.disabled = false;
            genBtn.style.opacity = "1";
            genBtn.innerHTML = `Generate <i class="fas fa-paper-plane text-[10px]"></i>`;
            promptInput.value = "";
        }
    }

    document.getElementById("promptInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            generateImage();
        }
    });
</script>
</body>
</html>
