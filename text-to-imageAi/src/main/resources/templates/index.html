<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI | Image Generation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #05070a;
            color: #e2e8f0;
            overflow: hidden;
        }

        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-item:hover {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .sidebar-active {
            background: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            border-right: 3px solid #3b82f6;
        }

        /* Animated Background Blobs */
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.15) 0%, rgba(37, 99, 235, 0) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .image-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .image-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }
    </style>
</head>
<body class="h-screen flex">

<!-- Background Blobs -->
<div class="blob top-[-100px] left-[-100px]"></div>
<div class="blob bottom-[-100px] right-[-100px]"></div>

<!-- Sidebar -->
<aside class="w-64 glass border-r border-slate-800 flex flex-col hidden md:flex">
    <div class="p-6">
        <div class="flex items-center gap-3 text-2xl font-bold tracking-tighter text-white">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                <i class="fas fa-bolt text-sm"></i>
            </div>
            NEXUS<span class="text-blue-500">AI</span>
        </div>
    </div>

    <nav class="flex-1 px-4 space-y-2 mt-4">
        <div class="sidebar-item sidebar-active p-3 rounded-xl cursor-pointer flex items-center gap-3 transition-all">
            <i class="fas fa-magic w-5"></i> <span>AI Generation</span>
        </div>
        <div class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 transition-all text-slate-400">
            <i class="fas fa-images w-5"></i> <span>My Feed</span>
        </div>
        <div class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 transition-all text-slate-400">
            <i class="fas fa-layer-group w-5"></i> <span>Models</span>
        </div>
        <div class="sidebar-item p-3 rounded-xl cursor-pointer flex items-center gap-3 transition-all text-slate-400">
            <i class="fas fa-user-friends w-5"></i> <span>Community</span>
        </div>
    </nav>

    <div class="p-4 mt-auto border-t border-slate-800">
        <div class="bg-slate-800/50 p-4 rounded-2xl">
            <div class="flex justify-between text-xs mb-2">
                <span class="text-slate-400">Tokens Left</span>
                <span class="text-blue-400">125 / 150</span>
            </div>
            <div class="w-full bg-slate-700 h-1.5 rounded-full">
                <div class="bg-blue-500 h-full rounded-full" style="width: 80%"></div>
            </div>
            <button class="w-full mt-3 py-2 text-xs bg-white text-black font-bold rounded-lg hover:bg-slate-200 transition-colors">
                UPGRADE PRO
            </button>
        </div>
    </div>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col relative overflow-hidden">

    <!-- Header -->
    <header class="h-16 glass flex items-center justify-between px-8 z-10">
        <div class="flex items-center gap-4">
            <span class="text-slate-400 text-sm"><i class="fas fa-users text-green-500 mr-2"></i> 1,242 Online</span>
        </div>
        <div class="flex items-center gap-4">
            <button class="text-slate-400 hover:text-white"><i class="far fa-bell text-lg"></i></button>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500"></div>
        </div>
    </header>

    <!-- Content Area -->
    <div class="flex-1 overflow-y-auto p-8" id="galleryContainer">
        <!-- Hero Welcome -->
        <div id="heroSection" class="max-w-4xl mx-auto text-center mt-12 mb-12">
            <h1 class="text-5xl font-extrabold text-white mb-4">Create the <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">Unthinkable.</span></h1>
            <p class="text-slate-400 text-lg">Your Spring AI-powered engine for professional grade imagery.</p>
        </div>

        <!-- Gallery Grid -->
        <div id="imageGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Images will appear here -->
        </div>
    </div>

    <!-- Prompt Input Area -->
    <div class="p-6 glass border-t border-slate-800 relative">
        <div class="max-w-4xl mx-auto relative">
            <div class="flex flex-col gap-4 bg-slate-900/80 border border-slate-700 p-2 rounded-2xl focus-within:border-blue-500 transition-all">
                    <textarea
                            id="promptInput"
                            class="w-full bg-transparent border-none outline-none p-4 text-white placeholder-slate-500 resize-none h-20"
                            placeholder="Describe what you want to see... (e.g. 'Cyberpunk samurai in a neon rain forest, 8k, highly detailed')"></textarea>

                <div class="flex items-center justify-between p-2 border-t border-slate-800">
                    <div class="flex gap-4 px-2">
                        <button title="Aspect Ratio" class="text-slate-400 hover:text-blue-400"><i class="fas fa-expand"></i></button>
                        <button title="Image Strength" class="text-slate-400 hover:text-blue-400"><i class="fas fa-sliders-h"></i></button>
                        <button title="Negative Prompt" class="text-slate-400 hover:text-blue-400"><i class="fas fa-minus-circle"></i></button>
                    </div>
                    <button onclick="generateImage()" id="genBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2.5 rounded-xl font-bold transition-all flex items-center gap-2">
                        <span>Generate</span>
                        <i class="fas fa-paper-plane text-xs"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    async function generateImage() {
        const promptInput = document.getElementById("promptInput");
        const prompt = promptInput.value.trim();
        const genBtn = document.getElementById("genBtn");
        const imageGrid = document.getElementById("imageGrid");
        const heroSection = document.getElementById("heroSection");

        if (!prompt) return;

        // UI State Change
        genBtn.disabled = true;
        genBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Building...`;
        if(heroSection) heroSection.style.display = 'none';

        // Create Placeholder Skeleton
        const skeletonId = 'skele-' + Date.now();
        const skeletonHTML = `
            <div id="${skeletonId}" class="image-card glass rounded-2xl overflow-hidden aspect-square flex flex-col">
                <div class="skeleton flex-1"></div>
                <div class="p-4 space-y-2">
                    <div class="skeleton h-3 w-3/4 rounded"></div>
                    <div class="skeleton h-3 w-1/2 rounded"></div>
                </div>
            </div>
        `;
        imageGrid.insertAdjacentHTML('afterbegin', skeletonHTML);

        const formData = new URLSearchParams();
        formData.append("prompt", prompt);

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData
            });

            if (!response.ok) throw new Error("Generation failed");

            // CRITICAL: Convert binary response to a displayable URL
            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);

            // Replace Skeleton with actual Image
            const skeleton = document.getElementById(skeletonId);
            skeleton.innerHTML = `
                <div class="relative group h-full">
                    <img src="${imageUrl}" class="w-full h-full object-cover rounded-2xl" alt="AI Generated">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4 rounded-2xl">
                        <p class="text-xs text-slate-200 line-clamp-2 mb-3">${escapeHtml(prompt)}</p>
                        <div class="flex gap-2">
                            <a href="${imageUrl}" download="ai-gen.png" class="flex-1 bg-white/20 hover:bg-white/30 backdrop-blur-md py-2 rounded-lg text-center text-xs font-bold transition-all">
                                <i class="fas fa-download mr-1"></i> Save
                            </a>
                            <button onclick="copyToClipboard('${escapeHtml(prompt)}')" class="w-10 bg-white/20 hover:bg-white/30 backdrop-blur-md py-2 rounded-lg text-xs transition-all">
                                <i class="far fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            skeleton.classList.remove('flex-col'); // Clean up flex classes for image display

        } catch (error) {
            console.error(error);
            document.getElementById(skeletonId).innerHTML = `
                <div class="p-8 text-center text-red-400">
                    <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
                    <p class="text-sm">Failed to generate. Check console.</p>
                </div>
            `;
        } finally {
            genBtn.disabled = false;
            genBtn.innerHTML = `<span>Generate</span><i class="fas fa-paper-plane text-xs"></i>`;
            promptInput.value = "";
        }
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text;
        return div.innerHTML;
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text);
        alert("Prompt copied to clipboard!");
    }

    // Enter key to send
    document.getElementById("promptInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            generateImage();
        }
    });
</script>
</body>
</html>
