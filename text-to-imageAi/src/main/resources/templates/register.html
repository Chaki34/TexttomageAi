<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nexus AI | Join Now</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #05070a; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .blob { position: absolute; width: 400px; height: 400px; background: rgba(37, 99, 235, 0.15); filter: blur(80px); border-radius: 50%; z-index: -1; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">
<div class="blob top-10 right-10"></div>

<div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-white">Create Account</h1>
        <p class="text-slate-400 mt-2">Start generating art today</p>
    </div>

    <!-- Exception Handler Message -->
    <div th:if="${error}" class="bg-red-500/20 text-red-400 p-3 rounded-xl mb-6 text-sm text-center border border-red-500/50" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" class="space-y-5">
        <div>
            <label class="block text-slate-300 text-sm font-medium mb-2">Username</label>
            <input type="text" name="username" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 outline-none transition-all">
        </div>
        <div>
            <label class="block text-slate-300 text-sm font-medium mb-2">Email Address</label>
            <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 outline-none transition-all">
        </div>
        <div>
            <label class="block text-slate-300 text-sm font-medium mb-2">Password</label>
            <input type="password" name="password" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:border-blue-500 outline-none transition-all">
        </div>
        <button type="submit" class="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-slate-200 transition-all">
            Create Account
        </button>
    </form>

    <p class="text-center text-slate-400 mt-8 text-sm">
        Already a member? <a th:href="@{/login}" class="text-blue-400 font-bold hover:underline">Log in</a>
    </p>
</div>
</body>
</html>
