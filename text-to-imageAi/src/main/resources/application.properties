spring.application.name=ai

# ==============================
# Pollinations AI Configuration
# ==============================

# Base URL for image generation
pollinations.base-url=https://image.pollinations.ai/prompt/

# Default model (optional)
pollinations.model=flux

# Image Size (optional)
pollinations.width=1024
pollinations.height=1024

# Optional Seed
# Use -1 for a random image every time
pollinations.seed=-1

# RestClient Timeouts (seconds)
pollinations.connect-timeout=30
pollinations.read-timeout=60