spring.application.name=ai

# ==============================
# MySQL Database Configuration
# ==============================
# Change 'localhost:3306/ai_db' to match your DB host and name
spring.datasource.url=jdbc:mysql://localhost:3306/TEXTtoIMAGE_AI_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==============================
# Pollinations AI Configuration
# ==============================
pollinations.base-url=https://image.pollinations.ai/prompt/
pollinations.model=flux
pollinations.width=1024
pollinations.height=1024
pollinations.seed=-1

# RestClient Timeouts (seconds)
pollinations.connect-timeout=30
pollinations.read-timeout=60

# ==============================
# Security & Thymeleaf
# ==============================
spring.thymeleaf.cache=false
# Increase max request size for image data
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB